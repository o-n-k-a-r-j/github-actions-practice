
name: Artifact Between Jobs

on:
  workflow_dispatch:

jobs:
  produce-report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate report
        run: |
          mkdir -p reports
          echo "Report generated by Job 1" > reports/build-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/build-report.txt
          if-no-files-found: error

  consume-report:
    needs: produce-report
    runs-on: ubuntu-latest

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: downloaded

      - name: Read report
        run: cat downloaded/build-report.txt

