name: Python Matrix Practice

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

        exclude:
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version

      - name: Fail Ubuntu Python 3.11
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: exit 1

      - name: Confirm completion
        run: echo "Matrix job completed successfully"

