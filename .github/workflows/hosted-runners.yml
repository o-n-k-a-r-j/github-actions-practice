
name: GitHub Hosted Runners Practice

on:
  workflow_dispatch:

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest

    steps:
      - name: Show Ubuntu information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami

  windows-job:
    runs-on: windows-latest

    steps:
      - name: Show Windows information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami

  macos-job:
    runs-on: macos-latest

    steps:
      - name: Show macOS information
        run: |
          echo "OS: ${{ runner.os }}"
          hostname
          whoami

