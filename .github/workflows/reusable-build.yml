
name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true

      environment:
        type: string
        required: true
        default: staging

    secrets:
      docker_token:
        required: true

    outputs:
      build_version:
        description: "Generated build version"
        value: ${{ jobs.build-app.outputs.build_version }}

jobs:
  build-app:
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.make_version.outputs.build_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print build information
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_ENV: ${{ inputs.environment }}
        run: echo "Building $APP_NAME for $TARGET_ENV"

      - name: Check Docker token
        env:
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          if [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker token is set: true"
          else
            echo "Docker token is set: false"
            exit 1
          fi

      - name: Generate build version
        id: make_version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v1.0-$SHORT_SHA"

          echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated build version: $VERSION"

