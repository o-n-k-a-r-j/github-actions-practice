on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkwhether secret exists
        env:
          MY_SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}

        run: |
          if [ -n "$MY_SECRET_MESSAGE" ]; then
            echo "the secret is set: true"
          else
            echo "the secret is set: false"
          fi
     
      
      - name: Use secret as environment variable
        env:
          API_TOKEN: ${{ secrets.MY_SECRET_MESSAGE }}

        run: |
          test -n "$API_TOKEN"
          echo "Credential successfully passed to this step"

